version: 2

# Security updates only. Routine upgrades are maintainer-run batches.
# Dependabot requires a schedule, but open-pull-requests-limit: 0 disables
# version-update PRs without disabling security updates, which are grouped
# per ecosystem entry.
updates:
  - package-ecosystem: npm
    directories:
      - /site
      - /desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /platforms/ios
    # The accepted native runner stays pinned; refresh its dependency graph.
    versioning-strategy: lockfile-only
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      ios-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: cargo
    directories:
      - /desktop/src-tauri
      - /desktop/vendor/glib
      - /platforms/macos/sudo
    # Preserve the upstream compatibility manifests, especially the backport.
    versioning-strategy: lockfile-only
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

name: Deploy website

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: machine-control-site-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy machinecontrol.dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://machinecontrol.dev
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: site
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level low

      - name: Build website
        working-directory: site
        run: pnpm build

      - name: Test release selection and download routes
        working-directory: site
        run: pnpm test

      - name: Bind production database
        working-directory: site
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: node scripts/prepare-ci-deploy.mjs

      - name: Deploy Worker
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Use the audited CLI from the frozen site lockfile.
        run: pnpm exec wrangler deploy

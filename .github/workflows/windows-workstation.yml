name: Windows workstation package
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable release version (e.g. 0.1.0); empty builds a CI preview only'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: windows-workstation-preview
  cancel-in-progress: false
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    environment: release
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-arm64, win-x64]
    steps:
      - name: Validate release version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:RELEASE_VERSION -and $env:RELEASE_VERSION -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Expected a stable semantic version' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'
      - name: Check portable contracts and native build
        run: |
          python bin/check --portable
          if ($LASTEXITCODE -ne 0) { throw 'Portable checks failed' }
          ./tests/windows/static.ps1
      - name: Fetch exact pinned provider
        run: python release/windows-package.py fetch-provider artifacts/provider --runtime '${{ matrix.runtime }}'
      - name: Sign verified provider bytes
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\artifacts\provider\providers\cua
          files-folder-filter: exe
          exclude-azure-cli-credential: true
          cache-dependencies: false
      - name: Publish host bound to signed provider digest
        env:
          WINDOWS_SIGNER_NAME: ${{ vars.WINDOWS_SIGNER_NAME }}
        run: |
          ./release/verify-windows-signatures.ps1 -Directory artifacts/provider -ExpectedPublisher $env:WINDOWS_SIGNER_NAME
          $digest = (Get-FileHash artifacts/provider/providers/cua/cua-driver.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          python release/windows-package.py build artifacts/payload --runtime '${{ matrix.runtime }}' --revision $env:GITHUB_SHA --provider-digest $digest
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
          $build = Get-Content artifacts/payload/build.json -Raw | ConvertFrom-Json
          if ($build.sourceDirty -or $build.sourceRevision -ne $env:GITHUB_SHA) { throw 'Unclean source build' }
          Copy-Item artifacts/provider/providers/cua/cua-driver.exe artifacts/payload/providers/cua/cua-driver.exe -Force
      - name: Sign runtime and lifecycle script
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\artifacts\payload
          files-folder-filter: exe,ps1
          files-folder-recurse: false
          exclude-azure-cli-credential: true
          cache-dependencies: false
      - name: Finalize payload and create file catalog
        run: |
          python release/windows-package.py finalize artifacts/payload
          if ($LASTEXITCODE -ne 0) { throw 'Package validation failed' }
          New-Item -ItemType Directory -Path artifacts/catalog | Out-Null
          New-FileCatalog -Path artifacts/payload -CatalogFilePath artifacts/catalog/package.cat -CatalogVersion 2.0
      - name: Sign complete payload catalog
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\artifacts\catalog
          files-folder-filter: cat
          exclude-azure-cli-credential: true
          cache-dependencies: false
      - name: Verify and archive final payload
        env:
          WINDOWS_SIGNER_NAME: ${{ vars.WINDOWS_SIGNER_NAME }}
        run: |
          Copy-Item artifacts/catalog/package.cat artifacts/payload/package.cat
          ./release/verify-windows-signatures.ps1 -Directory artifacts/payload -ExpectedPublisher $env:WINDOWS_SIGNER_NAME
          if ((Test-FileCatalog -Path artifacts/payload -CatalogFilePath artifacts/payload/package.cat -FilesToSkip 'package.cat') -ne 'Valid') {
            throw 'Final catalog validation failed'
          }
          if ('${{ matrix.runtime }}' -eq 'win-x64') {
            $schema = & ./artifacts/payload/machine-control-windows.exe schema | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $schema.schema -ne 'machine-control/v0') { throw 'Signed executable failed' }
            ./tests/windows/unlock-install-smoke.ps1 -Package artifacts/payload
          }
          python release/windows-package.py archive artifacts/payload --output artifacts/packages
          if ($LASTEXITCODE -ne 0) { throw 'Package validation failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workstation-${{ matrix.runtime }}
          path: artifacts/packages/*
          if-no-files-found: error
          retention-days: 14
  manifest:
    needs: package
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y minisign
      - run: python -m unittest discover -s tests/release -v
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: workstation-win-*
          merge-multiple: true
          path: artifacts/packages
      - name: Authenticate exact preview build
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          BUILD_RUN: ${{ github.run_id }}.${{ github.run_attempt }}
        run: |
          set -euo pipefail
          : "${RELEASE_SIGNING_KEY:?Missing signing key}"
          python release/workstation-manifest.py create artifacts/packages --revision "$GITHUB_SHA" --run "$BUILD_RUN"
          umask 077
          key_file="$(mktemp "$RUNNER_TEMP/workstation-key.XXXXXX")"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$RELEASE_SIGNING_KEY" > "$key_file"
          minisign -S -s "$key_file" -m artifacts/packages/manifest.json
          python release/workstation-manifest.py verify artifacts/packages --revision "$GITHUB_SHA" --run "$BUILD_RUN"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-windows-workstation
          path: artifacts/packages/*
          if-no-files-found: error
          retention-days: 14
      - name: Authenticate consumer release
        if: inputs.version != ''
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          WINDOWS_SIGNER_NAME: ${{ vars.WINDOWS_SIGNER_NAME }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          BUILD_RUN: ${{ github.run_id }}.${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python release/workstation-release.py create artifacts/packages --revision "$GITHUB_SHA" --run "$BUILD_RUN" --version "$RELEASE_VERSION" --publisher "$WINDOWS_SIGNER_NAME"
          umask 077
          key_file="$(mktemp "$RUNNER_TEMP/release-key.XXXXXX")"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$RELEASE_SIGNING_KEY" > "$key_file"
          minisign -S -s "$key_file" -m artifacts/packages/release.json
          python release/workstation-release.py verify artifacts/packages --revision "$GITHUB_SHA" --run "$BUILD_RUN" --version "$RELEASE_VERSION" --publisher "$WINDOWS_SIGNER_NAME"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: inputs.version != ''
        with:
          name: workstation-release
          path: artifacts/packages/*
          if-no-files-found: error
          retention-days: 14
  publish:
    if: inputs.version != ''
    needs: manifest
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: workstation-release
          path: packages
      - name: Publish immutable versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="workstation-v$RELEASE_VERSION"
          gh api "repos/$GH_REPO/releases?per_page=100" > previous-releases.json
          python3 - <<'PY'
          import json, os, re
          requested = tuple(map(int, os.environ['RELEASE_VERSION'].split('.')))
          for release in json.load(open('previous-releases.json')):
              match = re.fullmatch(r'workstation-v(\d+)\.(\d+)\.(\d+)', release['tag_name'])
              if match and not release['draft'] and not release['prerelease']:
                  if tuple(map(int, match.groups())) >= requested:
                      raise SystemExit('Release version must be newer than every published stable package')
          PY
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release already exists; use a new version, never replace signed assets.' >&2
            exit 1
          fi
          printf 'Signed Windows x64 and ARM64 Computer Control packages.\n\nInstall through Yep Anywhere Computer Control settings. Ordinary installation runs as the logged-in user; protected unlock is a separate explicit setup.\n\nSource: %s\n' "$GITHUB_SHA" > notes.md
          gh release create "$tag" packages/* --target "$GITHUB_SHA" --title "Machine Control $RELEASE_VERSION" --notes-file notes.md --draft
          gh release edit "$tag" --draft=false --latest

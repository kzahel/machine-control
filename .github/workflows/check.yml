name: Cross-platform checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  coordinator:
    name: Coordinator (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - run: pnpm --dir runtime install --frozen-lockfile
      - run: pnpm --dir runtime check
      - run: python bin/check --portable

  browser:
    name: Shared core with real Chrome extension (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - run: pnpm --dir runtime install --frozen-lockfile
      - run: pnpm --dir desktop install --frozen-lockfile
      - run: pnpm --dir desktop exec playwright install --with-deps chromium --no-shell
      - run: pnpm --dir runtime browser

  native:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v6
        if: runner.os == 'Windows'
        with:
          # Keep SDK acquisition independent of moving channel download links.
          dotnet-version: '8.0.426'
      - run: python bin/check --native

[package]
name = "machine-control-desktop"
version = "0.3.0"
edition = "2021"
default-run = "macui"

[[bin]]
name = "macui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde_json = "1"
libc = "0.2"

[profile.dev]
debug = "line-tables-only"
incremental = false

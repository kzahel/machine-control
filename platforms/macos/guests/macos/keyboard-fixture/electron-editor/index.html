<!doctype html><meta charset="utf-8"><title>Machine Control Keyboard Editor</title>
<style>body{font:16px system-ui;margin:24px}textarea{width:100%;height:280px;font:18px monospace}input{font:18px system-ui}</style>
<label for="find">Find</label> <input id="find" aria-label="Find text" hidden>
<label for="text"><h1>Keyboard editor</h1></label><textarea id="text" aria-label="Editor text" autofocus></textarea>
<script>
const text = document.getElementById('text'), find = document.getElementById('find');
text.addEventListener('input', () => editor.input(text.value));
find.addEventListener('input', () => editor.find(find.value));
find.addEventListener('keydown', event => {
  if (event.key === 'Escape') { find.hidden = true; text.focus(); }
});
editor.onFind(() => { find.hidden = false; find.value = ''; find.focus(); });
text.focus(); editor.ready();
</script>
